name: Continuous integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voltex
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: voltex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voltex -d voltex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://voltex:ci-only-password@localhost:5432/voltex_test?schema=public
      TEST_DATABASE_URL: postgresql://voltex:ci-only-password@localhost:5432/voltex_test?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      AUTO_SEED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate database client
        run: npm run db:generate
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build production applications
        run: npm run build
