name: voltex
services:
  api:
    image: voltex-api:${RELEASE_SHA:-local}
    build:
      context: ..
      target: api
      args:
        SITE_URL: ${SITE_URL:?Set SITE_URL}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      AUTO_SEED: "false"
      UPLOAD_DIR: /app/backend/uploads
      TRUST_PROXY: 1
    volumes:
      - uploads:/app/backend/uploads
    restart: unless-stopped
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  web:
    image: voltex-web:${RELEASE_SHA:-local}
    build:
      context: ..
      target: web
      args:
        SITE_URL: ${SITE_URL:?Set SITE_URL}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
volumes:
  uploads:
